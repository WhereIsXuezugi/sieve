<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"
     role="img" aria-label="An explanation bar: 41 percent source, 28 percent interest, 17 percent channel, 9 percent freshness, 5 percent novelty">
  <title>The explanation bar</title>
  <style>
    .t { font-family: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size: 15px; font-weight: 500; fill: #1c2128; }
    .l { font-family: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size: 12.5px; fill: #4d545e; }
    .pct { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 12.5px; fill: #767d86; }
    .m { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size: 11px; fill: #767d86; }
    .note { font-family: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size: 12px; font-style: italic; fill: #767d86; }
  </style>

  <rect x="20" y="20" width="660" height="260" rx="4" fill="#f5f5f2"
        stroke="#c8cac2" stroke-width="1"/>

  <text x="40" y="56" class="t">Writing a page allocator from scratch</text>
  <text x="40" y="78" class="m">Kernel Internals&#160;&#160;·&#160;&#160;84K views&#160;&#160;·&#160;&#160;38:12</text>

  <path d="M43 96 h251.2 v14 h-251.2 a3 3 0 0 1-3-3 v-8 a3 3 0 0 1 3-3 z" fill="#3f3aa8"/><rect x="294.2" y="96" width="173.6" height="14" fill="#0f6b60"/><rect x="467.79999999999995" y="96" width="105.4" height="14" fill="#4a7fb5"/><rect x="573.1999999999999" y="96" width="55.8" height="14" fill="#916200"/><path d="M628.9999999999999 96 h28.0 a3 3 0 0 1 3 3 v8 a3 3 0 0 1-3 3 h-28.0 z" fill="#6c3480"/>

  
    <rect x="40" y="139" width="10" height="10" rx="2" fill="#3f3aa8"/>
    <text x="60" y="148" class="pct">41%</text>
    <text x="104" y="148" class="l">from a channel you subscribe to</text>
    <rect x="40" y="165" width="10" height="10" rx="2" fill="#0f6b60"/>
    <text x="60" y="174" class="pct">28%</text>
    <text x="104" y="174" class="l">matches your interests</text>
    <rect x="40" y="191" width="10" height="10" rx="2" fill="#4a7fb5"/>
    <text x="60" y="200" class="pct">17%</text>
    <text x="104" y="200" class="l">channel priority and watch time</text>
    <rect x="40" y="217" width="10" height="10" rx="2" fill="#916200"/>
    <text x="60" y="226" class="pct">9%</text>
    <text x="104" y="226" class="l">recently published</text>
    <rect x="40" y="243" width="10" height="10" rx="2" fill="#6c3480"/>
    <text x="60" y="252" class="pct">5%</text>
    <text x="104" y="252" class="l">outside your usual topics</text>

  <text x="40" y="294" class="note">Every video carries one. The segments are the ranking arithmetic, not a summary of it.</text>
</svg>
