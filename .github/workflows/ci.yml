name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The demo path is the one every new user hits first, and it exercises
      # scoring, affinity, interests and training end to end without a network.
      - name: Smoke test the offline demo
        env:
          SIEVE_DATA_DIR: ${{ runner.temp }}/sieve-ci
        run: |
          sieve demo
          sieve quality
          sieve doctor --quick
          python - <<'PY'
          from fastapi.testclient import TestClient
          from sieve.app import create_app
          from sieve.config import Config

          client = TestClient(create_app(Config.load(), start_worker=False))
          for path in ["/", "/settings", "/channels", "/rules",
                       "/brief", "/debugger", "/analytics"]:
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              print(f"{response.status_code}  {path}")
          PY

  container:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sieve:ci .
      - name: Run the demo inside the image
        run: docker run --rm -e SIEVE_DATA_DIR=/tmp/d sieve:ci sieve demo
