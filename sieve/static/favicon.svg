<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sieve">
  <title>Sieve</title>
  <!-- Favicon variant of the mark. At 16px the seven-square top row turns to
       mush, so the pool is reduced to four and the strokes are heavier; the
       three-colour why-bar is what has to survive, because it is the part
       anyone recognises. -->
  <rect width="64" height="64" rx="12" fill="#3f3aa8"/>
  <g fill="#ffffff">
    <rect x="13" y="16" width="7" height="7" rx="1.5"/>
    <rect x="24" y="16" width="7" height="7" rx="1.5"/>
    <rect x="35" y="16" width="7" height="7" rx="1.5"/>
    <rect x="46" y="16" width="5" height="7" rx="1.5" opacity=".45"/>
  </g>
  <g fill="#ffffff" opacity=".6">
    <rect x="19" y="28" width="7" height="7" rx="1.5"/>
    <rect x="30" y="28" width="7" height="7" rx="1.5"/>
    <rect x="41" y="28" width="7" height="7" rx="1.5"/>
  </g>
  <g>
    <path d="M13 42h14v10H13a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" fill="#ffffff"/>
    <rect x="27" y="42" width="12" height="10" fill="#7fd8c9"/>
    <path d="M39 42h9a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-9z" fill="#f0b23c"/>
  </g>
</svg>
